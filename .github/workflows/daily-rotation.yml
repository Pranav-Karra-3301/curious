name: Daily Question Rotation

on:
  schedule:
    # Run at 5:00 AM UTC = Midnight EST (during standard time)
    # Note: During EDT (daylight saving), this will be 1 AM EDT
    # For exact midnight, you'd need 4 AM UTC during EDT
    - cron: '0 5 * * *'
  workflow_dispatch: # Allow manual trigger for testing

env:
  NODE_VERSION: '20'

jobs:
  rotate-question:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run rotation script
        id: rotate
        run: node scripts/rotate-question.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Verify rotation
        run: node scripts/verify-rotation.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ Daily rotation failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `
            ## Daily Question Rotation Failed

            **Time:** ${new Date().toISOString()}
            **Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            Please check the logs and manually trigger a rotation if needed.
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'automation']
            });
